name: Server V2 checks

on:
  push:
    paths:
      - 'server-v2/**'
      - '.github/workflows/server-v2.yml'
  pull_request:
    paths:
      - 'server-v2/**'
      - '.github/workflows/server-v2.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server-v2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.8'
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev --python 3.12
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync ruff check app scripts tests
      - run: uv run --no-sync mypy app scripts
