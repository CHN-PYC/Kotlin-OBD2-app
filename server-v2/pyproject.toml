[project]
name = "vehicle-agent-server"
version = "0.1.0"
description = "Vehicle diagnostic Agent backend built as a learning project"
requires-python = ">=3.12,<3.14"
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "configdict>=2.14.2",
  "fastapi>=0.116,<1",
  "fastembed>=0.7,<0.8",
  "httpx>=0.28,<1",
  "httpx2>=2.12,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.10,<3",
  "qdrant-client>=1.19.0",
  "redis>=6,<8",
  "tokenizers>=0.22,<0.24",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
