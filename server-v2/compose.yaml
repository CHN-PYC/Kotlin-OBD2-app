services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: vehicle-agent-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
  redis:
    image: redis:7.4-alpine
    container_name: vehicle-agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_storage:/data

volumes:
  qdrant_storage:
  redis_storage:
